steps:
  build-go-client-tag:
    name: build-go-client-tag
    image: golang:latest
    environment:
      PROTOC_VERSION: 33.2
    commands:
      - apt-get update && apt-get install -y unzip
      - curl -LO https://github.com/protocolbuffers/protobuf/releases/download/v$${PROTOC_VERSION}/protoc-$${PROTOC_VERSION}-linux-x86_64.zip
      - unzip protoc-$${PROTOC_VERSION}-linux-x86_64.zip -d /usr/local
      - export PATH=$PATH:/usr/local/bin
      # Install Go protobuf plugins
      - go install google.golang.org/protobuf/cmd/protoc-gen-go@latest
      - go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@latest
      # Generate Go protobuf code from the proto file with explicit plugin paths
      - PROTOC_GO_PLUGIN_PATH=$(go env GOPATH)/bin/protoc-gen-go
      - PROTOC_GRPC_PLUGIN_PATH=$(go env GOPATH)/bin/protoc-gen-go-grpc
      - mkdir -p src/client/go/ffmpegpb
      - protoc --plugin=protoc-gen-go=$${PROTOC_GO_PLUGIN_PATH} --go_out=src/client/go/ffmpegpb --plugin=protoc-gen-go-grpc=$${PROTOC_GRPC_PLUGIN_PATH} --go-grpc_out=src/client/go/ffmpegpb src/proto/ffmpeg.proto

      # Navigate to the Go client directory
      - cd src/client/go

      # Initialize Go module
      - go mod init grpc-ffmpeg-client

      # Download Go modules and generate go.sum
      - go mod tidy
      - go mod edit -replace=grpc-ffmpeg/ffmpegpb=./ffmpegpb

      # Build the Go client executable with version information
      - go build -ldflags="-X main.version=${CI_COMMIT_TAG}" -o grpc-ffmpeg-client .

  # Upload the built binary to GitHub Release
  github-release:
    image: woodpeckerci/plugin-release # Use a suitable version
    settings:
      api_key:
        from_secret: GITHUB_TOKEN # This secret must be configured in Woodpecker
      files:
        - src/client/go/grpc-ffmpeg-client # Path to the built binary
      prerelease: false # Set to true if tags like v1.0.0-rc.1 are used
      checksum:
        - md5
        - sha1
        - sha256
      template: |
        ## grpc-ffmpeg-client release ${CI_COMMIT_TAG}

        This release includes the `grpc-ffmpeg-client` binary.

when:
  branch: ${CI_REPO_DEFAULT_BRANCH}
  event: tag
