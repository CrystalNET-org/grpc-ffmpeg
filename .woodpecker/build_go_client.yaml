steps:
  build-go-client:
    name: build-go-client
    image: golang:latest
    commands:
      # Install specific protoc version for consistency with server
      - PROTOC_VERSION=33.2
      - curl -LO https://github.com/protocolbuffers/protobuf/releases/download/v${PROTOC_VERSION}/protoc-${PROTOC_VERSION}-linux-x86_64.zip
      - unzip protoc-${PROTOC_VERSION}-linux-x86_64.zip -d /usr/local
      - export PATH=$PATH:/usr/local/bin
      # Install Go protobuf plugins
      - go install google.golang.org/protobuf/cmd/protoc-gen-go@latest
      - go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@latest
      # Ensure GOPATH/bin is in PATH for protoc to find plugins
      - export PATH=$PATH:$(go env GOPATH)/bin

      # Generate Go protobuf code from the proto file
      - protoc --go_out=src/client/go --go_opt=paths=source_relative --go-grpc_out=src/client/go --go-grpc_opt=paths=source_relative src/proto/ffmpeg.proto

      # Navigate to the Go client directory
      - cd src/client/go

      # Initialize Go module
      - go mod init grpc-ffmpeg-client
      
      # Download Go modules and generate go.sum
      - go mod tidy

      # Build the Go client executable
      - go build -o grpc-ffmpeg-client .
