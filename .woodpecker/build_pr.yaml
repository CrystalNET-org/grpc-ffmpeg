# Test-build the worker image for pull requests (e.g. Renovate updates) without
# pushing it; Renovate only automerges once this passes.
when:
  - event: pull_request

steps:
  docker-build-test:
    image: woodpeckerci/plugin-docker-buildx:6.1.2
    # Disk the step writes into its own container (not the workspace volume), so the
    # scheduler accounts for it and the kubelet does not evict the step first
    backend_options:
      kubernetes:
        resources:
          requests:
            ephemeral-storage: 4Gi
    settings:
      repo: ffmpeg-worker-test
      dockerfile: docker/Dockerfile.server
      platforms: linux/amd64
      dry_run: true
