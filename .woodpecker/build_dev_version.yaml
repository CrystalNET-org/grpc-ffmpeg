steps:
  docker-build-dev:
    image: woodpeckerci/plugin-docker-buildx:6.1.2
    # Disk the step writes into its own container (not the workspace volume), so the
    # scheduler accounts for it and the kubelet does not evict the step first
    backend_options:
      kubernetes:
        resources:
          requests:
            ephemeral-storage: 4Gi
    settings:
      debug: true
      repo: harbor.crystalnet.org/library/ffmpeg-worker,ghcr.io/crystalnet-org/ffmpeg-worker
      logins:
      - registry: https://harbor.crystalnet.org/
        username: robot$library+woodpecker
        password:
          from_secret: harbor_token
      - registry: https://ghcr.io/
        username: psych0d0g
        password:
          from_secret: GITHUB_TOKEN
      registry: harbor.crystalnet.org
      tags: dev
      dockerfile: docker/Dockerfile.server
      platforms: linux/amd64
      dry_run: false
when:
  branch: ${CI_REPO_DEFAULT_BRANCH}
  event: push
