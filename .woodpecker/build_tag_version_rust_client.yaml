steps:
  - name: build_binaries
    image: harbor.crystalnet.org/dockerhub-proxy/library/rust:1.99
    environment:
      # renovate: datasource=github-releases depName=protocolbuffers/protobuf extractVersion=^v(?<version>.*)$
      PROTOC_VERSION: "36.2"
      CARGO_BUILD_JOBS: "8"
      # CI never reuses incremental data; writing it only adds file cache that
      # counts against the memory limit
      CARGO_INCREMENTAL: "0"
    # Cargo runs one compiler per CPU it sees, ~150 MB each, and without a CPU
    # limit that is every core of the node; bound it so the build fits in memory
    # (measured: ~0.4 GiB + ~0.15 GiB per job, ~1.6 GiB with 8). The limit also
    # counts the file cache of what the build writes, which got a 3 GiB limit
    # OOM-killed mid-build, hence the headroom.
    backend_options:
      kubernetes:
        resources:
          requests:
            cpu: "8"
            memory: 2Gi
          limits:
            memory: 6Gi
    commands:
      # Install build tools and protobuf compiler
      - apt-get update && apt-get install -y curl unzip clang llvm python3-pip
      - curl -LO https://github.com/protocolbuffers/protobuf/releases/download/v$${PROTOC_VERSION}/protoc-$${PROTOC_VERSION}-linux-x86_64.zip
      - unzip protoc-$${PROTOC_VERSION}-linux-x86_64.zip -d /usr/local

      # Both binaries are fully static (musl); see src/client/rust/.cargo/config.toml
      - rustup target add x86_64-unknown-linux-musl aarch64-unknown-linux-musl
      - cd src/client/rust

      # Build for amd64
      - PATH="/usr/local/bin:$PATH" cargo build --locked --release --target=x86_64-unknown-linux-musl
      - mv target/x86_64-unknown-linux-musl/release/grpc-ffmpeg-client ../../grpc-ffmpeg-client-amd64

      # Build for arm64
      - PATH="/usr/local/bin:$PATH" cargo build --locked --release --target=aarch64-unknown-linux-musl
      - mv target/aarch64-unknown-linux-musl/release/grpc-ffmpeg-client ../../grpc-ffmpeg-client-arm64

      # Build for Windows (amd64); zig provides the C compiler and linker
      - pip3 install --break-system-packages ziglang cargo-zigbuild
      - rustup target add x86_64-pc-windows-gnu
      - PATH="/usr/local/bin:$PATH" cargo zigbuild --locked --release --target=x86_64-pc-windows-gnu
      - mv target/x86_64-pc-windows-gnu/release/grpc-ffmpeg-client.exe ../../grpc-ffmpeg-client-windows-amd64.exe

      - ls -l ../../grpc-ffmpeg-client-amd64 ../../grpc-ffmpeg-client-arm64 ../../grpc-ffmpeg-client-windows-amd64.exe

  - name: publish_release
    image: harbor.crystalnet.org/dockerhub-proxy/woodpeckerci/plugin-release:0.3.2
    settings:
      files:
        - 'src/grpc-ffmpeg-client-amd64'
        - 'src/grpc-ffmpeg-client-arm64'
        - 'src/grpc-ffmpeg-client-windows-amd64.exe'
      api_key:
        from_secret: GITHUB_TOKEN
      note: "Automated release by Woodpecker CI for $${WOODPECKER_TAG}" # Use a template variable
      prerelease: false # Or true if it's a prerelease tag
      draft: false # Set to true to create a draft release

when:
  branch: ${CI_REPO_DEFAULT_BRANCH}
  event: tag
