steps:
  - name: build_binaries
    image: rust:1.98
    environment:
      # renovate: datasource=github-releases depName=protocolbuffers/protobuf extractVersion=^v(?<version>.*)$
      PROTOC_VERSION: "36.2"
    commands:
      # Install build tools and protobuf compiler
      - apt-get update && apt-get install -y curl unzip clang llvm
      - curl -LO https://github.com/protocolbuffers/protobuf/releases/download/v$${PROTOC_VERSION}/protoc-$${PROTOC_VERSION}-linux-x86_64.zip
      - unzip protoc-$${PROTOC_VERSION}-linux-x86_64.zip -d /usr/local

      # Both binaries are fully static (musl); see src/client/rust/.cargo/config.toml
      - rustup target add x86_64-unknown-linux-musl aarch64-unknown-linux-musl
      - cd src/client/rust

      # Build for amd64
      - PATH="/usr/local/bin:$PATH" cargo build --locked --release --target=x86_64-unknown-linux-musl
      - mv target/x86_64-unknown-linux-musl/release/grpc-ffmpeg-client ../../grpc-ffmpeg-client-amd64

      # Build for arm64
      - PATH="/usr/local/bin:$PATH" cargo build --locked --release --target=aarch64-unknown-linux-musl
      - mv target/aarch64-unknown-linux-musl/release/grpc-ffmpeg-client ../../grpc-ffmpeg-client-arm64

      - ls -l ../../grpc-ffmpeg-client-amd64 ../../grpc-ffmpeg-client-arm64

  - name: publish_release
    image: woodpeckerci/plugin-release:0.3.2
    settings:
      files:
        - 'src/grpc-ffmpeg-client-amd64'
        - 'src/grpc-ffmpeg-client-arm64'
      api_key:
        from_secret: GITHUB_TOKEN
      note: "Automated release by Woodpecker CI for $${WOODPECKER_TAG}" # Use a template variable
      prerelease: false # Or true if it's a prerelease tag
      draft: false # Set to true to create a draft release

when:
  branch: ${CI_REPO_DEFAULT_BRANCH}
  event: tag
