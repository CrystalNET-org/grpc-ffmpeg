when:
  - event: push
    branch: main

steps:
  - name: build
    image: rust:1.98
    environment:
      # renovate: datasource=github-releases depName=protocolbuffers/protobuf extractVersion=^v(?<version>.*)$
      PROTOC_VERSION: "36.2"
      CARGO_BUILD_JOBS: "8"
    # Cargo runs one compiler per CPU it sees, ~150 MB each, and without a CPU
    # limit that is every core of the node; bound it so the build fits in memory
    # (measured: ~0.4 GiB + ~0.15 GiB per job, ~1.6 GiB with 8)
    backend_options:
      kubernetes:
        resources:
          requests:
            cpu: "8"
            memory: 2Gi
          limits:
            memory: 3Gi
    commands:
      - apt-get update && apt-get install -y curl unzip clang llvm python3-pip
      - curl -LO https://github.com/protocolbuffers/protobuf/releases/download/v$${PROTOC_VERSION}/protoc-$${PROTOC_VERSION}-linux-x86_64.zip
      - unzip protoc-$${PROTOC_VERSION}-linux-x86_64.zip -d /usr/local
      - cd src/client/rust
      - PATH="/usr/local/bin:$PATH" cargo test --locked
      # Both binaries are fully static (musl); see .cargo/config.toml
      - rustup target add x86_64-unknown-linux-musl aarch64-unknown-linux-musl
      - PATH="/usr/local/bin:$PATH" cargo build --locked --release --target=x86_64-unknown-linux-musl
      - mv target/x86_64-unknown-linux-musl/release/grpc-ffmpeg-client ./grpc-ffmpeg-client-amd64
      - PATH="/usr/local/bin:$PATH" cargo build --locked --release --target=aarch64-unknown-linux-musl
      - mv target/aarch64-unknown-linux-musl/release/grpc-ffmpeg-client ./grpc-ffmpeg-client-arm64
      # Windows: zig provides the C compiler and linker (and the MinGW headers/libs)
      - pip3 install --break-system-packages ziglang cargo-zigbuild
      - rustup target add x86_64-pc-windows-gnu
      - PATH="/usr/local/bin:$PATH" cargo zigbuild --locked --release --target=x86_64-pc-windows-gnu
      - mv target/x86_64-pc-windows-gnu/release/grpc-ffmpeg-client.exe ./grpc-ffmpeg-client-windows-amd64.exe
      - ls -l ./grpc-ffmpeg-client-amd64 ./grpc-ffmpeg-client-arm64 ./grpc-ffmpeg-client-windows-amd64.exe
