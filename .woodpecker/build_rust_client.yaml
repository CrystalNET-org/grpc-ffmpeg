when:
  - event: push
    branch: main

steps:
  - name: build
    image: rust:1.98
    environment:
      # renovate: datasource=github-releases depName=protocolbuffers/protobuf extractVersion=^v(?<version>.*)$
      PROTOC_VERSION: "36.2"
    commands:
      - apt-get update && apt-get install -y curl unzip musl-tools gcc-aarch64-linux-gnu
      - curl -LO https://github.com/protocolbuffers/protobuf/releases/download/v$${PROTOC_VERSION}/protoc-$${PROTOC_VERSION}-linux-x86_64.zip
      - unzip protoc-$${PROTOC_VERSION}-linux-x86_64.zip -d /usr/local
      - cd src/client/rust
      - PATH="/usr/local/bin:$PATH" cargo test --locked
      - rustup target add x86_64-unknown-linux-musl
      - PATH="/usr/local/bin:$PATH" cargo build --locked --release --target=x86_64-unknown-linux-musl
      - mv target/x86_64-unknown-linux-musl/release/grpc-ffmpeg-client ./grpc-ffmpeg-client-amd64
      - rustup target add aarch64-unknown-linux-gnu
      - PATH="/usr/local/bin:$PATH" cargo build --locked --release --target=aarch64-unknown-linux-gnu
      - mv target/aarch64-unknown-linux-gnu/release/grpc-ffmpeg-client ./grpc-ffmpeg-client-arm64
      - ls -l ./grpc-ffmpeg-client-amd64 ./grpc-ffmpeg-client-arm64
