syntax = "proto3";

package ffmpeg;

service FFmpegService {
  rpc ExecuteCommand (CommandRequest) returns (stream CommandResponse);
}

message CommandRequest {
  // Shell-quoted command line. Kept for compatibility with older servers;
  // servers prefer `args` when it is set.
  string command = 1;
  // Exact argv (binary name first). Avoids any quoting round-trip.
  repeated string args = 2;
}

message CommandResponse {
  string output = 1;
  int32 exit_code = 2;
  string stream = 3; // "stdout", "stderr", or "exit_code"
  bytes binary_output = 4;
}
