[package]
name = "grpc-ffmpeg-client"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1", features = ["full"] }
tonic = { version = "0.14", features = ["tls", "tls-roots"] }
prost = "0.12"
anyhow = "1.0"
thiserror = "1.0"
clap = { version = "4.4", features = ["derive"] }

[build-dependencies]
tonic-build = "0.14"
