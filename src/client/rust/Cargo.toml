[package]
name = "grpc-ffmpeg-client"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1.53", features = ["rt", "macros", "fs", "time"] }
tonic = { version = "0.14.6", features = ["tls-ring"] }
prost = "0.14.4"
tonic-prost = "0.14.6"
anyhow = "1"
libc = "0.2"

[build-dependencies]
tonic-prost-build = "0.14.6" # Match tonic version

[profile.release]
# Small, fast-starting binary; this client is spawned for every ffmpeg/ffprobe call
lto = true
codegen-units = 1
strip = true
