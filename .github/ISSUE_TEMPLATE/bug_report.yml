name: Bug report
description: Something does not work as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! Using the Jellyfin plugin? Problems with the plugin itself belong to
        [Jellyfin.Plugin.GrpcFfmpeg](https://github.com/CrystalNET-org/Jellyfin.Plugin.GrpcFfmpeg/issues).
        Security problems: please report them privately, see [SECURITY.md](https://github.com/CrystalNET-org/grpc-ffmpeg/blob/main/SECURITY.md).
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: If a specific ffmpeg command fails, include it.
      placeholder: |
        1. ...
        2. ...
  - type: input
    id: worker-version
    attributes:
      label: Worker image
      description: Image and tag, e.g. ghcr.io/crystalnet-org/ffmpeg-worker:8.1.3-7.8
    validations:
      required: true
  - type: input
    id: client-version
    attributes:
      label: Client
      description: Client release and platform, or the Jellyfin plugin version if it provides the client
    validations:
      required: true
  - type: input
    id: jellyfin-version
    attributes:
      label: Jellyfin version
      description: If Jellyfin is involved
  - type: textarea
    id: setup
    attributes:
      label: Setup
      description: Kubernetes, Docker or bare metal; GPU and hardware acceleration type; how the shared directories are mounted
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: |
        The worker's log, and the client's activity log (LOG_FILE, or the console of the Jellyfin plugin).
        Remove tokens and other secrets before posting.
      render: text
